name: Deploy website (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

concurrency:
  group: pages-solana-wallet-toolkit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - name: Deploy to solana-wallet-toolkit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.157.0 pages deploy out --project-name=solana-wallet-toolkit --branch=main --commit-dirty=true
